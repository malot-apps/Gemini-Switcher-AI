name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Environment (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env for build process..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Stage Generated APK
        id: stage_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::No APK file generated during build!"
            exit 1
          fi
          echo "Found APK at: $RAW_APK"
          mkdir -p release-artifacts
          TARGET_APK="release-artifacts/Gemini-Switcher-AI-debug.apk"
          cp "$RAW_APK" "$TARGET_APK"
          echo "APK_PATH=$TARGET_APK" >> $GITHUB_ENV
          echo "Staged APK at $TARGET_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Switcher-AI-APK
          path: release-artifacts/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Releases (Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
